<style>
/* Layout: one-column phone app. Dusk-and-mountain hero taken from the poster, status cards on top,
   four-tab bottom bar (Now, Program, My Notes, Report), bottom sheet for session reflections. */
:root{
  --display:"Plus Jakarta Sans","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Plus Jakarta Sans","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --bg:#0A1330; --surface:#111D45; --surface-2:#18285B; --line:#263668; --line-strong:#3E5090;
  --fg:#EEF1FA; --muted:#A9B4D2;
  --accent:#F5B223; --accent-ink:#0A1330; --accent-text:#F5B223; --focus:#FFD36E;
  --live:#FF6B5E; --live-ink:#1A0A08; --ok:#5FD08F; --danger:#FF8A80;
  --nav-bg:#0C173A;
  --hero-fg:#F5F7FF; --gold:#F5B223; --navy:#0A1330;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F2F4FA; --surface:#FFFFFF; --surface-2:#E7EBF6; --line:#D3DAEA; --line-strong:#AEB9D8;
    --fg:#0E1A3D; --muted:#4F5C85;
    --accent:#F5B223; --accent-ink:#0E1A3D; --accent-text:#8A5600; --focus:#0E1A3D;
    --live:#C42F1D; --live-ink:#FFFFFF; --ok:#1B7A46; --danger:#B3261E;
    --nav-bg:#FFFFFF;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F2F4FA; --surface:#FFFFFF; --surface-2:#E7EBF6; --line:#D3DAEA; --line-strong:#AEB9D8;
  --fg:#0E1A3D; --muted:#4F5C85;
  --accent:#F5B223; --accent-ink:#0E1A3D; --accent-text:#8A5600; --focus:#0E1A3D;
  --live:#C42F1D; --live-ink:#FFFFFF; --ok:#1B7A46; --danger:#B3261E;
  --nav-bg:#FFFFFF;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:500 15px/1.5 var(--display);-webkit-font-smoothing:antialiased}
p,h1,h2,h3,ul{margin:0;padding:0}
ul{list-style:none}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1{font:800 28px/1.15 var(--display);text-wrap:balance}
h2{font:800 22px/1.2 var(--display);text-wrap:balance}
h3{font:800 18px/1.25 var(--display)}
.big{font:800 26px/1.15 var(--display);text-wrap:balance}
.small{font:500 13px/1.45 var(--display);color:var(--muted)}
.meta{font:600 14px/1.4 var(--display);color:var(--muted)}
.sub{color:var(--muted);max-width:46ch}
.eyebrow{font:800 11px/1.2 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--accent-text)}

.wrap{width:100%;max-width:580px;margin-left:auto;margin-right:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stack{display:grid;gap:14px;align-content:start;padding-block:18px 130px}
.stack>*{min-width:0}

/* hero */
.hero{position:relative;background:linear-gradient(176deg,#0D2058 0%,#1E3F86 52%,#B9833F 100%);color:var(--hero-fg);overflow:hidden}
.hero-in{position:relative;z-index:1;display:grid;gap:2px;padding-block:16px 76px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.brand img{width:44px;height:44px;border-radius:50%;flex:none}
.b1{font:800 12px/1.2 var(--display);letter-spacing:.07em;text-transform:uppercase}
.b2{font:700 10px/1.3 var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-top:3px}
.h-pre{font:800 clamp(20px,6vw,28px)/1 var(--display);letter-spacing:.04em;text-transform:uppercase}
.h-big{font:900 clamp(72px,24vw,112px)/.9 var(--display);color:var(--gold);background:linear-gradient(180deg,#FFD25E 0%,#F0A21A 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;width:fit-content}
.h-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:4px}
.h-retreat{font:italic 600 clamp(42px,13vw,60px)/1 var(--serif)}
.h-year{background:var(--gold);color:var(--navy);padding:4px 16px;transform:skewX(-10deg);font:900 22px/1.3 var(--display)}
.h-year b{display:inline-block;transform:skewX(10deg)}
.h-theme{margin-top:14px;font:800 11px/1.5 var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.h-theme i{font-style:normal;opacity:.7;margin-left:4px;margin-right:4px}
.mtn{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:64px;display:block}

/* page header on inner tabs */
.phead{display:flex;align-items:center;gap:8px;font:800 11px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.phead img{border-radius:50%}
.head{display:grid;gap:8px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px;align-content:start;min-width:0}
details.card{display:block}
details.card summary{cursor:pointer;font:800 15px/1.3 var(--display);min-height:32px;display:flex;align-items:center}
.dbody{display:grid;gap:10px;padding-top:10px}
.live-card{border:2px solid var(--accent)}
.cd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cd div{background:var(--surface-2);border-radius:12px;padding:12px 4px;text-align:center}
.cd b{display:block;font:800 34px/1.1 var(--display);font-variant-numeric:tabular-nums}
.cd span{font:700 11px/1.2 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.verse{font:italic 500 19px/1.45 var(--serif);text-wrap:balance}
.thanks .serif{font:italic 600 30px/1.2 var(--serif)}
.phones{display:grid;gap:4px}
.phones a{font:800 16px/1.4 var(--display);text-decoration:none;-webkit-user-select:text;user-select:text;width:fit-content}
.link{font:800 14px/1.4 var(--display);color:var(--accent-text);width:fit-content}
.split{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.split>*{min-width:0}
.q{white-space:pre-wrap;overflow-wrap:anywhere}
.q b{display:block;font:800 11px/1.4 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mini li{display:grid;grid-template-columns:54px minmax(0,1fr);gap:12px;padding:9px 0;border-top:1px solid var(--line);font-weight:600}
.mini li:first-child{border-top:0}
.t1{font:800 15px/1.3 var(--display);font-variant-numeric:tabular-nums}
.t2{display:block;font:600 12px/1.3 var(--display);color:var(--muted);font-variant-numeric:tabular-nums}

/* buttons, chips */
.btn{width:100%;min-height:50px;padding:0 20px;border-radius:12px;border:0;font:800 15px/1.2 var(--display);cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none}
.btn-gold{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line-strong)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:8px;min-height:40px;font:800 13px/1.2 var(--display);color:var(--accent-text);text-decoration:underline;cursor:pointer}
.linkbtn.danger{color:var(--danger)}
.chip{display:inline-block;font:800 11px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;padding:7px 10px;border-radius:999px;white-space:nowrap}
.chip.go{background:var(--accent);color:var(--accent-ink)}
.chip.ok{color:var(--ok);border:1.5px solid var(--ok)}
.chip.mute{color:var(--muted);border:1.5px solid var(--line)}
.pill{display:inline-flex;align-items:center;gap:8px;width:fit-content;background:var(--live);color:var(--live-ink);font:800 11px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;padding:7px 12px;border-radius:999px}
.pill.sm{padding:5px 9px;font-size:10px}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface-2);border:1.5px dashed var(--accent-text);border-radius:12px;padding:6px 6px 6px 14px;font:600 13px/1.4 var(--display)}

/* program list */
.list li{border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list li.live{background:var(--surface-2);border-radius:12px;border-top-color:transparent}
.list li.live+li{border-top-color:transparent}
.row{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:12px;align-items:start;width:100%;padding:14px 8px;text-align:left;background:none;border:0;color:inherit;font:inherit}
button.row{cursor:pointer}
.bd{display:grid;gap:3px;min-width:0}
.eb{font:800 11px/1.3 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.eb.gold{color:var(--accent-text)}
.rt{font:800 17px/1.3 var(--display);overflow-wrap:anywhere}
.hostline,.nt{font:500 13px/1.4 var(--display);color:var(--muted)}
.ac{display:grid;gap:6px;justify-items:end}
.past .rt,.past .t1{color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg.two{grid-template-columns:repeat(2,1fr)}
.seg button{min-height:46px;border-radius:12px;border:1.5px solid var(--line-strong);background:transparent;font:800 14px/1.2 var(--display);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.team li{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)}
.team li:first-child{border-top:0}
.team b{font:800 16px/1.3 var(--display)}

/* ratings */
.stars{display:flex;gap:2px;flex-wrap:wrap}
.star{width:44px;height:44px;display:grid;place-items:center;background:none;border:0;padding:0;border-radius:10px;cursor:pointer;color:var(--accent-text)}
.star svg{width:32px;height:32px;fill:none;stroke:var(--line-strong);stroke-width:1.6;stroke-linejoin:round}
.star.on svg{fill:var(--accent);stroke:var(--accent-text)}
.stars.sm .star{width:40px;height:40px}
.stars.sm .star svg{width:28px;height:28px}
.mini-stars{display:flex;gap:1px}
.mini-stars svg{width:16px;height:16px;fill:none;stroke:var(--line-strong);stroke-width:1.6;stroke-linejoin:round}
.mini-stars svg.on{fill:var(--accent);stroke:var(--accent-text)}
.goal{display:grid;gap:2px;padding-top:6px;border-top:1px solid var(--line)}
.goal:first-of-type{border-top:0}

/* forms */
.lab{display:block;font:700 14px/1.3 var(--display)}
.ta,.inp,.sel{width:100%;border-radius:12px;border:1.5px solid var(--line-strong);background:var(--bg);color:var(--fg);font:500 16px/1.45 var(--display);padding:12px}
.ta{min-height:92px;resize:vertical}
.sel{min-height:48px;padding:0 12px}
.check{display:flex;gap:12px;align-items:center;min-height:44px;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.preview{white-space:pre-wrap;overflow-wrap:anywhere;font:500 13px/1.55 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;max-height:280px;overflow:auto;user-select:text;-webkit-user-select:text}

.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.opt{display:flex;gap:12px;align-items:center;min-height:50px;padding:8px 12px;border:1.5px solid var(--line-strong);border-radius:12px;font:700 14px/1.3 var(--display);cursor:pointer}
.opt input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.opt:has(input:checked){border-color:var(--accent);background:var(--surface-2)}
.chip.tbl{color:var(--accent-text);border:1.5px solid var(--accent-text)}
.tlist li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-weight:700}
.tlist li:first-child{border-top:0}
.tlist span{min-width:0;overflow-wrap:anywhere}
.tlist b{font:900 20px/1 var(--display);color:var(--accent-text);white-space:nowrap}
.seg.one{grid-template-columns:1fr}
.seg.one button{height:auto;padding:12px 14px;text-align:left;overflow-wrap:anywhere}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--nav-bg);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:580px;margin-left:auto;margin-right:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{display:grid;justify-items:center;align-content:center;gap:3px;min-height:56px;border-radius:12px;text-decoration:none;color:var(--muted);font:800 11px/1.1 var(--display);letter-spacing:.02em}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{background:var(--surface-2);color:var(--accent-text)}

/* sheet + toast */
.team li.person{justify-content:flex-start;align-items:flex-start}
.pager{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:6px 0 18px;position:-webkit-sticky;position:sticky;bottom:calc(74px + env(safe-area-inset-bottom,0px));padding:10px 0;background:var(--bg);z-index:5}
.pager .btn{width:auto;min-width:96px;justify-self:start}
.pager .btn:last-child{justify-self:end}
.dots{display:flex;gap:7px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--gold)}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.kv span{color:var(--muted,#6B7595);font-size:14px}
.kv b{text-align:right}
.more{margin:12px 0 4px}.more summary{cursor:pointer;font-weight:600;padding:8px 0;color:var(--muted,#6B7595)}
.kv b .key{display:block;font-weight:500;font-size:13px;color:var(--muted,#6B7595);margin-top:2px}
.also{display:block;font-style:normal;font-size:13px;color:var(--muted,#6B7595);margin-top:2px}
.dlimg{width:100%;height:auto;border-radius:12px;margin-top:10px;border:1px solid var(--line)}
.qbox{background:var(--card2,rgba(201,162,39,.12));border-left:3px solid var(--gold);border-radius:10px;padding:10px 12px;margin:4px 0 10px}
.qbox ol{margin:6px 0 0;padding-left:20px}
.qbox li{margin:0 0 6px;line-height:1.4}
.person{display:flex;gap:12px;align-items:flex-start;list-style:none}
.avatar{position:relative;flex:0 0 64px;width:64px;height:64px;border-radius:50%;overflow:hidden;background:var(--gold);color:#0B1633;font:800 22px/64px var(--display);text-align:center}
.avatar img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;object-position:50% 25%}
.pinfo{display:flex;flex-direction:column;gap:3px;min-width:0}
.pinfo .small{line-height:1.45}
.sheet{position:fixed;top:0;right:0;bottom:0;left:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet .back{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(4,9,28,.62)}
.panel{position:relative;width:100%;max-width:580px;max-height:92%;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;display:grid;gap:12px;align-content:start;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.p-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.p-head>div{min-width:0;display:grid;gap:4px}
.x{flex:none;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line-strong);background:none;display:grid;place-items:center;cursor:pointer}
.x svg{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--fg);color:var(--bg);font:700 14px/1.3 var(--display);padding:11px 18px;border-radius:999px;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- Refinement: elegant type, calmer cards, photo theme ---- */
:root{--r:22px;--shadow:0 1px 2px rgba(7,14,40,.06),0 10px 28px -14px rgba(7,14,40,.28)}
h1,h2,h3,.big{font-family:var(--serif);font-weight:700;letter-spacing:-.005em}
h2.big,.big{font-size:27px;line-height:1.18}
h3{font-size:20px}
.eyebrow{letter-spacing:.2em;font-size:10.5px}
.card{border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--shadow);padding:22px 20px}
.stack{gap:16px}
.card.welcome{position:relative;overflow:hidden;padding:26px 22px;border-color:transparent;background:linear-gradient(160deg,var(--surface) 0%,var(--surface-2) 100%)}
.card.welcome::before{content:"";position:absolute;left:22px;top:0;width:44px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.card.welcome p:not(.eyebrow){font-size:16px;line-height:1.65;color:var(--muted)}
.btn{border-radius:999px;letter-spacing:.02em;font-weight:700}
.btn-gold{box-shadow:0 8px 20px -10px rgba(245,178,35,.9)}
.cd>div{border-radius:16px}
.themes{padding:20px 16px 16px}
.themes .eyebrow{padding:0 4px 12px}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{position:relative;margin:0;border-radius:16px;overflow:hidden;height:0;padding-bottom:132%;background:#1a2550}
.tile img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block}

async function post(payload){
  var opt={method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)};
  try{
    var res=await fetch(BACKEND,opt);
    var d=await res.json();
    return {ok:!!(d&&d.ok),data:d};
  }catch(e){
    if(!(e instanceof TypeError))return {ok:false,data:null};   /* the server answered, but not with JSON */
    try{await fetch(BACKEND,Object.assign({mode:'no-cors'},opt));return {ok:true,data:null};}catch(e2){return {ok:false,data:null};}
  }
}
async function flush(){
  if(!BACKEND||flushing)return;
  flushing=true;
  try{
    var list=S.outbox.slice();
    for(var i=0;i<list.length;i++){
      var o=list[i],res=await post(o.payload);
      var refused=!res.ok&&res.data&&res.data.ok===false&&res.data.error&&res.data.error!=='server';
      if(!res.ok&&!refused)break;                          /* no signal or server busy: keep it and try later */
      S.outbox=S.outbox.filter(function(x){return !(x.kind===o.kind&&x.at===o.at);});
      if(res.ok){
        S.sent[o.kind]=Date.now();delete S.err[o.kind];
        if(o.kind==='register'){
          if(res.data&&res.data.tables){S.reg.line=res.data.line;S.tables=res.data.tables;setRoom(res.data);}
          else needTables=true;
        }
      }else{S.err[o.kind]=res.data.error;}
      save();
    }
  }finally{flushing=false;}
  if(needTables){needTables=false;fetchTables();}
}

  ensureRoom();
  var R=S.room||{};
  if(R.day)return {num:'Day visitor',cap:'',mates:'No room needed'};
  if(!R.room)return {num:'To be confirmed',cap:'',mates:'To be confirmed'};
  return {num:'Room '+String(R.room).replace(/^room\s*/i,''),
    cap:R.captain?'('+R.captain+' – This person is in charge of the key)':'',
    mates:R.mates.length?R.mates.join(', '):'You have the room to yourself'};
}
function fetchTables(){
  if(!BACKEND||!S.sent.register)return;
  fetch(BACKEND+(BACKEND.indexOf('?')>-1?'&':'?')+'action=tables&pid='+encodeURIComponent(pid()),{cache:'no-store'})
    .then(function(r){return r.json();})
    .then(function(d){
      if(d&&d.ok&&d.registered===false&&!pending('register')){
        /* the organisers reset check-ins: let this phone check in again */
        S.sent.register=false;S.reg=REG0();S.tables=[];S.room={room:'',mates:[],captain:'',day:false,found:false};save();
        var v0=curView();if($('#sheet').hidden&&v0!=='report'&&v0!=='checkin'&&v0!=='register')render();return;
      }
      if(!d||!d.ok||!d.registered)return;
      var before=JSON.stringify(S.room);setRoom(d);
      if(JSON.stringify(d.tables)===JSON.stringify(S.tables)&&S.reg.line===d.line&&before===JSON.stringify(S.room))return;
      S.tables=d.tables;S.reg.line=d.line;save();
      var v=curView();
      if($('#sheet').hidden&&v!=='report'&&v!=='checkin'&&v!=='register')render();
    }).catch(function(){});
}
function alsoAt(label){
  return TIMED.filter(function(x){return (x.type==='group'||x.type==='return')&&x.follow===label;}).map(function(x){return x.title.split(/\s+[\u2013-]\s+/)[0].trim();}).join(', ');
}
function tablesList(){
  var tb=myTables();
  if(!tb.length)return '<p>You are registered. Your tables appear here once the sessions are on the program.</p>';
  return '<ul class="tlist">'+tb.map(function(x){var al=alsoAt(x.session);return '<li><span>'+esc(x.session)+(al?'<em class="also">Same table for: '+esc(al)+'</em>':'')+'</span><b>Table '+x.table+'</b></li>';}).join('')+'</ul>'+
    (BACKEND?'':'<p class="small">Example tables for this preview. Real tables come from the organisers’ sheet.</p>');
}
function registerCard(){
  if(isRegistered())return '<section class="card"><p class="eyebrow">Your tables</p>'+tablesList()+'<a class="link" href="#register">View my registration</a></section>';

  return '<section class="card"><p class="eyebrow">At the start of the retreat</p><h3>Register as a delegate</h3><p>Give your details once and see your table for every session.</p><a class="btn btn-gold" href="#register">Register</a></section>';

function regSend(){
  if(!regReady())return;

function liveCard(it,t){
  var pct=Math.min(100,Math.max(0,(t-it.s)/(it.e-it.s)*100)),btn='';

  return '<section class="card live-card"><div class="pill"><span class="dot"></span>Happening now</div>'+
    '<div>'+(it.tag?'<p class="eyebrow">'+esc(it.tag)+'</p>':'')+'<h2 class="big">'+esc(it.title)+'</h2></div>'+
    '<p class="meta">'+(it.en?clock(it.s)+' to '+clock(it.e):'From '+clock(it.s))+'</p>'+(tableOfItem(it)?'<p class="meta"><b>Your table: '+tableOfItem(it)+'</b></p>':'')+
    (it.speaker?'<p>Led by: '+esc(it.speaker)+'</p>':'')+(it.venue?'<p class="small">'+esc(it.venue)+'</p>':'')+(it.note?'<p>'+esc(it.note)+'</p>':'')+
    '<div class="bar" role="img" aria-label="Session progress"><i style="width:'+pct.toFixed(1)+'%"></i></div><p class="small">'+(it.en?dur(it.e-t)+' left':'Next item at '+clock(it.e))+'</p>'+btn+'</section>';
}

function wrapLines(ctx,text,max){
  var words=String(text).split(/\s+/),lines=[],cur='';
  words.forEach(function(w){var t=cur?cur+' '+w:w;if(ctx.measureText(t).width>max&&cur){lines.push(cur);cur=w;}else cur=t;});
  if(cur)lines.push(cur);return lines;
}
function cardRows(){
  return myTables().map(function(x){var it=SEATED.filter(function(y){return y.label===x.session;})[0];var al=alsoAt(x.session);return {name:(it?it.title:x.session)+(al?'  (same table for: '+al+')':''),table:x.table,when:it&&it.timed?when(it):''};});
}
function makeCard(){
  var W=1080,pad=64,rows=cardRows(),nm=(S.reg.first+' '+S.reg.last).trim()||'Delegate';
  var ri=roomInfo();
  var c=document.createElement('canvas'),ctx=c.getContext('2d');
  function pass(draw){var y=0;y=draw(y);return y;}
  function paint(ctx,H){
    var y=0;ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#0B1633';ctx.fillRect(0,0,W,250);
    ctx.fillStyle='#F5B21F';ctx.font='700 30px "Plus Jakarta Sans", Arial, sans-serif';ctx.fillText('FAITH BIBLE CHURCH SOUTH AFRICA',pad,84);
    ctx.fillStyle='#ffffff';ctx.font='800 58px "Plus Jakarta Sans", Arial, sans-serif';ctx.fillText('The Glorious Men’s Retreat 2026',pad,160);
    ctx.fillStyle='#cdd5ee';ctx.font='400 30px Arial, sans-serif';ctx.fillText('20–21 November · '+VENUE_SHORT,pad,212);
    y=330;ctx.fillStyle='#0B1633';ctx.font='700 64px Arial, sans-serif';
    wrapLines(ctx,nm,W-2*pad).forEach(function(l){ctx.fillText(l,pad,y);y+=76;});
    y+=10;
    var blocks=[['ROOM',ri.num,ri.cap]];if(!S.room.day)blocks.push(['ROOM PARTNER',ri.mates,'']);
    blocks.forEach(function(kv){
      ctx.fillStyle='#6B7595';ctx.font='700 26px Arial, sans-serif';ctx.fillText(kv[0],pad,y);y+=44;
      ctx.fillStyle='#0B1633';ctx.font='700 44px Arial, sans-serif';
      wrapLines(ctx,kv[1],W-2*pad).forEach(function(l){ctx.fillText(l,pad,y);y+=54;});
      if(kv[2]){ctx.fillStyle='#B8860B';ctx.font='700 30px Arial, sans-serif';wrapLines(ctx,kv[2],W-2*pad).forEach(function(l){ctx.fillText(l,pad,y);y+=40;});}
      y+=22;
    });
    ctx.fillStyle='#6B7595';ctx.font='700 26px Arial, sans-serif';ctx.fillText('MY TABLES',pad,y);y+=22;
    rows.forEach(function(r){
      ctx.strokeStyle='#E2E6F2';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(W-pad,y);ctx.stroke();y+=44;
      ctx.font='400 30px Arial, sans-serif';var ls=wrapLines(ctx,r.name,W-2*pad-190),top=y;
      ctx.fillStyle='#0B1633';ls.forEach(function(l){ctx.fillText(l,pad,y);y+=38;});
      if(r.when){ctx.fillStyle='#6B7595';ctx.font='400 26px Arial, sans-serif';ctx.fillText(r.when,pad,y);y+=36;}
      ctx.fillStyle='#B8860B';ctx.font='700 46px Arial, sans-serif';ctx.textAlign='right';ctx.fillText('Table '+r.table,W-pad,top+8);ctx.textAlign='left';y+=22;
    });
    y+=10;ctx.fillStyle='#6B7595';ctx.font='400 26px Arial, sans-serif';ctx.fillText(VENUE,pad,y);y+=50;
    return y;
  }
  c.width=W;c.height=4000;var H=paint(ctx,4000)+10;
  c.width=W;c.height=H;ctx=c.getContext('2d');paint(ctx,H);
  return c;
}
var VENUE_SHORT='Mannah Executive Guestlodge';
function downloadCard(){
  var c;try{c=makeCard();}catch(e){toast('Could not make the card on this phone');return;}
  function finish(url,isBlob){
    dlUrl=url;
    var out=$('#dl-out');if(out)out.innerHTML=dlHTML();
    try{var a=document.createElement('a');a.href=url;a.download='My-Retreat-Card.png';a.style.display='none';document.body.appendChild(a);a.click();document.body.removeChild(a);}catch(e){}
    toast('Card saved. Check your downloads or photos');
  }
  if(c.toBlob){c.toBlob(function(b){if(b)finish(URL.createObjectURL(b),true);else finish(c.toDataURL('image/png'),false);},'image/png');}
  else finish(c.toDataURL('image/png'),false);
}

function viewNow(t){
  var live=TIMED.filter(function(x){return isLive(x,t);})[0], next=TIMED.filter(function(x){return x.s>t;})[0];
  var P0='',P2='';
  var welcome='<section class="card welcome"><p class="eyebrow">Welcome</p><h2 class="big">Welcome to The Glorious Men\u2019s Retreat</h2><p>We are so glad you are here, brother. We pray that you enjoy every moment of this weekend and that you are richly blessed.</p></section>';
  var liveS=(live&&live.type!=='break'&&live.type!=='meal')?live:null;
  var nextS=TIMED.filter(function(x){return x.s>t&&x.type!=='break'&&x.type!=='meal';})[0];

function rowHTML(it,t){

  }
  var pill=live?'<span class="pill sm"><span class="dot"></span>Now</span>':'';

}

var QSETS=[
 {re:/myth of manhood/i,q:["Which messages about being a real man did I take in growing up, and from whom?","Where do I still measure myself by the world's standard instead of God's?","What is one myth I am ready to lay down this weekend?"]},
 {re:/god.{0,2}s design|who god made/i,q:["What does it mean to me that God made me on purpose?","Which part of God's design for a man do I find hardest to accept or to live out?","Who reflects that design well in my life, and what can I learn from him?"]},
 {re:/masks/i,q:["Which mask do I wear most often: strong, funny, busy, silent, in control?","Who in my life really knows the man behind the mask?","What would change if I took it off with one trusted brother this week?"]},
 {re:/mental health/i,q:["What am I carrying (stress, anger, grief, worry) that I have not spoken about?","What stops me from asking for help, and is that reason really true?","Who can I talk to this week, and what will I say to him?"]},
 {re:/power and money/i,q:["Do I use the power and money I have mostly for myself or to serve others?","What do my time, spending and attention say I treasure?","Where do my family or community need me to lead with more humility or generosity?"]}
];
var QDEFAULT=["What did I hear that I needed to hear?","What is God asking of me as a leader, a lover and a father?","Who will see the change in me first?"];
function questionsFor(it){for(var i=0;i<QSETS.length;i++){if(QSETS[i].re.test(it.title||''))return QSETS[i].q;}return QDEFAULT;}
function paintQuestions(it){
  var q=questionsFor(it);
  $('#sh-q').innerHTML='<p class="eyebrow">Questions to think about</p><ol>'+q.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol>';
}
function closeSheet(){
  if($('#sheet').hidden)return;
  var had=curKey&&hasRefl(S.refl[curKey]);
  $('#sheet').hidden=true;document.body.style.overflow='';
  if(curKey&&S.refl[curKey]&&!hasRefl(S.refl[curKey])){delete S.refl[curKey];save();}
  curKey=null;render();
  if(had)toast('Saved on this phone');
}

/* ---------- Events ---------- */
document.addEventListener('click',function(e){
  var el=e.target;if(!el.closest)return;
  var st=el.closest('.star');
  if(st){
    var g=st.closest('.stars'),v=+st.dataset.v,sc2=g.dataset.scope,nm=g.dataset.name;
    if(sc2==='rep'){S.rep.ratings[nm]=S.rep.ratings[nm]===v?0:v;}
    else if(sc2==='rf'&&curKey){var r=getR(curKey);r.rating=r.rating===v?0:v;r.updated=Date.now();}
    save();paintStars();updateReport();if(curKey)sheetStatus();return;
  }
  var stp=el.closest('[data-step]');if(stp){nowStep=+stp.dataset.step;render();window.scrollTo(0,0);return;}
  if(el.closest('[data-dl]')){downloadCard();return;}
  if(el.closest('[data-findroom]')){toast('Looking for your room…');fetchTables();ensureRoom();render();return;}
  if(el.closest('[data-flyer]')){openFlyer();return;}
  if(el.closest('[data-copylink]')){copyText(appLink()).then(function(ok){toast(ok?'App link copied':'Could not copy the link');});return;}
  var op=el.closest('[data-open]');if(op){openSheet(op.dataset.open);return;}
  if(el.closest('[data-close]')){closeSheet();return;}
  var dy=el.closest('[data-day]');if(dy){progDay=+dy.dataset.day;render();return;}
  var ag=el.closest('[data-again]');if(ag){S.rep.again=S.rep.again===ag.dataset.again?'':ag.dataset.again;save();fillReport();updateReport();return;}
  if(el.closest('[data-realtime]')){preview=null;render();return;}
  if(el.closest('[data-install]')){if(deferredInstall){deferredInstall.prompt();deferredInstall.userChoice.then(function(){deferredInstall=null;render();});}return;}
  var ct=el.closest('[data-ctheme]');if(ct){S.pre.theme=S.pre.theme===ct.dataset.ctheme?'':ct.dataset.ctheme;save();fillCheckin();updateCheckin();return;}
  if(el.closest('#reg-send')){var rb=el.closest('#reg-send');if(!rb.disabled)regSend();return;}
  if(el.closest('#chk-send')){sendKind('checkin');return;}
  if(el.closest('#rep-send')){sendKind('report');return;}
  if(el.closest('#chk-copy')){copyText(preText()).then(function(ok){toast(ok?'Check-in copied':'Could not copy. Select the text and copy it.');});return;}
  if(el.closest('#rep-copy')){copyText(reportText()).then(function(ok){toast(ok?'Report copied':'Could not copy. Select the text and copy it.');});return;}
  if(el.closest('#notes-copy')){var b=el.closest('#notes-copy');if(b.disabled)return;copyText(notesText()).then(function(ok){toast(ok?'Notes copied':'Could not copy on this browser');});return;}
  if(el.closest('#clear')){
    if(!clearArmed){clearArmed=true;render();setTimeout(function(){if(clearArmed){clearArmed=false;if(curView()==='notes')render();}},5000);}
    else{var keep=S.pid;S={pid:keep,refl:{},rep:REP0(),pre:PRE0(),sent:{},outbox:[],reg:REG0(),tables:[],err:{}};save();clearArmed=false;render();toast('Cleared');}
    return;
  }
});
function onField(e){
  if(e.target&&e.target.dataset&&e.target.dataset.hope!==undefined){
    var lab=HOPES[+e.target.dataset.hope],a=S.pre.hope,ix=a.indexOf(lab);
    if(e.target.checked&&ix<0)a.push(lab);
    if(!e.target.checked&&ix>-1)a.splice(ix,1);
    save();updateCheckin();return;
  }
  var id=e.target&&e.target.id;if(!id)return;
  var gm={'g-first':'first','g-last':'last','g-phone':'phone','g-email':'email','g-group':'group','g-diet':'diet','g-emerg':'emerg','g-emerg-phone':'emergPhone'};
  if(gm[id]){S.reg[gm[id]]=e.target.value;save();updateReg();return;}
  if(id==='g-consent'){S.reg.consent=e.target.checked;save();updateReg();return;}
  var pm={'c-expect':'expect','c-learn':'learn','c-discover':'discover','c-heart':'heart','c-name':'name'};
  if(pm[id]){S.pre[pm[id]]=e.target.value;save();updateCheckin();return;}
  if(id==='rf-stood'||id==='rf-action'){
    if(!curKey)return;var r=getR(curKey);r[id==='rf-stood'?'stood':'action']=e.target.value;r.updated=Date.now();save();sheetStatus();return;
  }
  var map={'r-best':'best','r-improve':'improve','r-commit':'commit','r-name':'name'};
  if(map[id]){S.rep[map[id]]=e.target.value;save();updateReport();}
  else if(id==='r-inc'){S.rep.inc=e.target.checked;save();updateReport();}
}
document.addEventListener('input',onField);
document.addEventListener('change',function(e){
  if(e.target&&e.target.id==='pv'){preview=PREVIEWS[+e.target.value][1];render();}
  else onField(e);
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet();});
window.addEventListener('hashchange',function(){viewOv=null;render();window.scrollTo(0,0);});
/* Tabs and in-page links work even where the address bar or hash cannot change (sandboxed viewers, in-app browsers, file readers). */
document.addEventListener('click',function(e){
  var a=e.target.closest?e.target.closest('a[href^="#"]'):null;if(!a)return;
  var v=a.getAttribute('href').slice(1);if(VIEWS.indexOf(v)<0)return;
  e.preventDefault();viewOv=v;
  try{if(location.hash!=='#'+v){location.hash=v;}}catch(x){}
  render();window.scrollTo(0,0);
});
window.addEventListener('online',function(){flush().then(paintStatus);fetchProgram();fetchTables();});
document.addEventListener('visibilitychange',function(){if(!document.hidden){tick(true);flush().then(paintStatus);fetchProgram();fetchTables();}});

/* ---------- Start ---------- */
load();
$('#sh-stars').innerHTML=starsHTML('rf','rf','Session rating','');
render();
fetchProgram();flush();fetchTables();
setInterval(tick,20000);
setInterval(function(){fetchProgram();fetchTables();},300000);
})();
</script>
